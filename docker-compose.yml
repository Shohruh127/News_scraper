# Infrastructure only. Django, the Celery worker and beat run from the host in M1.
# Ports are non-default so this stack cannot collide with the IMV project's containers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: news_radar
      POSTGRES_USER: news_radar
      POSTGRES_PASSWORD: news_radar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_radar -d news_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
