x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-app-service: &app-service
  build:
    context: .
    target: runtime
  image: news-radar:${NEWS_RADAR_IMAGE_TAG:-local}
  init: true
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-news_radar}:${POSTGRES_PASSWORD:-news_radar}@postgres:5432/${POSTGRES_DB:-news_radar}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_radar}
      POSTGRES_USER: ${POSTGRES_USER:-news_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_radar}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging
    restart: unless-stopped

  worker-fetch:
    <<: *app-service
    command: celery -A config worker -Q fetch -c 10 --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker-llm:
    <<: *app-service
    command: celery -A config worker -Q llm -c 2 --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  worker-publish:
    <<: *app-service
    command: celery -A config worker -Q publish -c 1 --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  bot:
    <<: *app-service
    command: python -m apps.digest.bot
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  beat:
    <<: *app-service
    command: celery -A config beat --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web:
    <<: *app-service
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  redisdata: