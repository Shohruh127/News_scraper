services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: news_radar
      POSTGRES_USER: news_radar
      POSTGRES_PASSWORD: news_radar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_radar -d news_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Config reaches every service below through `env_file`, never through the image --
  # `.dockerignore` keeps `.env` out of the build so it cannot go stale there again.
  #
  # After editing `.env`, apply it with `docker compose up -d <service>`.
  # `docker compose restart` does NOT work: it restarts the existing container with the
  # environment it was created with, so the file is re-read only when the container is
  # recreated. Measured 2026-08-18 -- restart reported the old value, up -d the new one.
  worker-fetch:
    build: .
    command: uv run celery -A config worker -Q fetch -c 10 --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://news_radar:news_radar@postgres:5432/news_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-llm:
    build: .
    command: uv run celery -A config worker -Q llm -c 2 --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://news_radar:news_radar@postgres:5432/news_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-publish:
    build: .
    command: uv run celery -A config worker -Q publish -c 1 --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://news_radar:news_radar@postgres:5432/news_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    command: uv run celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://news_radar:news_radar@postgres:5432/news_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    command: >
      uv run sh -c "python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://news_radar:news_radar@postgres:5432/news_radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
