[project]
name = "news-scraper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3,<4",
    "celery[redis]>=5.6.3",
    "django>=6.0.8",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-environ>=0.14.0",
    "feedparser>=6.0.14",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.1.4",
    "trafilatura>=2.2.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Migrations are generated, not written.
exclude = ["**/migrations/*", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
